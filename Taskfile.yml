---
# https://taskfile.dev

version: "3"

vars:
  REPO: cenk1cenk2/qmk-firmware
  DIST: dist
  # The pip qmk package only ships clone/console/env/setup; compile and flash
  # live inside a qmk_firmware checkout and appear once QMK_HOME points at one.
  QMK_HOME:
    sh: echo "${QMK_HOME:-$HOME/development/qmk_firmware}"

env:
  QMK_HOME: "{{.QMK_HOME}}"

tasks:
  install:
    desc: Installs the required dependencies on pull.
    cmds:
      - yay -S avr-gcc avr-glibc avrdude qmk-udev-rules-git
      - uv sync
      - git -C {{.QMK_HOME}} submodule update --init --recursive
      - qmk config user.qmk_home="{{.QMK_HOME}}"
      - qmk config user.overlay_dir="$(pwd)"

  clean:
    desc: Remove downloaded and compiled firmware.
    cmds:
      - rm -rf {{.DIST}}

  compile:sofle:rev1:cenk1cenk2:
    desc: Compile sofle/rev1 with the cenk1cenk2 keymap.
    cmds:
      - task: compile
        vars:
          KEYBOARD: sofle
          REVISION: rev1
          KEYMAP: cenk1cenk2

  download:sofle:rev1:cenk1cenk2:
    desc: Download the latest CI build of sofle/rev1 cenk1cenk2.
    cmds:
      - task: download
        vars:
          KEYBOARD: sofle
          REVISION: rev1
          KEYMAP: cenk1cenk2

  flash:sofle:rev1:cenk1cenk2:
    desc: Flash sofle/rev1 cenk1cenk2. Run once per half, resetting that half when prompted.
    cmds:
      - task: flash
        vars:
          KEYBOARD: sofle
          REVISION: rev1
          KEYMAP: cenk1cenk2

  compile:
    internal: true
    requires:
      vars:
        - KEYBOARD
        - REVISION
        - KEYMAP
    vars:
      FIRMWARE: "{{.KEYBOARD}}_{{.REVISION}}_{{.KEYMAP}}.hex"
    cmds:
      - mkdir -p {{.DIST}}
      # qmk drops the firmware in the userspace root, per builddefs/common_rules.mk.
      - qmk compile -kb {{.KEYBOARD}} -km {{.KEYMAP}}
      - mv {{.FIRMWARE}} {{.DIST}}/{{.FIRMWARE}}

  download:
    internal: true
    requires:
      vars:
        - KEYBOARD
        - REVISION
        - KEYMAP
    vars:
      FIRMWARE: "{{.KEYBOARD}}_{{.REVISION}}_{{.KEYMAP}}.hex"
    cmds:
      - mkdir -p {{.DIST}}
      - gh release download latest -R {{.REPO}} -p "{{.FIRMWARE}}" -D {{.DIST}} --clobber

  flash:
    internal: true
    requires:
      vars:
        - KEYBOARD
        - REVISION
        - KEYMAP
    vars:
      FIRMWARE: "{{.KEYBOARD}}_{{.REVISION}}_{{.KEYMAP}}.hex"
    preconditions:
      - sh: test -f {{.DIST}}/{{.FIRMWARE}}
        msg: "{{.DIST}}/{{.FIRMWARE}} not found - run the matching download or compile task first."
    cmds:
      - qmk flash {{.DIST}}/{{.FIRMWARE}}
